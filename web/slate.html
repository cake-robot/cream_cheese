<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate — Watchability</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="slate">

<div class="slate-frame">
<header class="chrome">
  <nav>
    <a href="/slate.html" aria-current="page">Slate</a>
    <a href="/top.html">Top games</a>
    <a href="/index.html">Games</a>
    <a href="/settings.html">Spoilers</a>
    <a href="/analytics.html">Analytics</a>
    <a href="/feed.html" data-admin-only>Feed</a>
  </nav>
</header>
<div class="mnav-bar" id="mnav-bar">
  <button type="button" class="mnav-trig" id="mnav-trig" aria-expanded="false" aria-controls="mnav-drawer">
    <span class="mnav-page-title">Slate</span><span class="c" id="mnav-chev">⌄</span>
  </button>
  <div class="mnav-drawer" id="mnav-drawer" hidden></div>
</div>

<main>
  <div class="filters" id="filters">
    <div class="scope-toggle" id="scope-toggle">
      <button type="button" data-scope="day">Day</button>
      <button type="button" data-scope="week">Week</button>
    </div>
    <div class="date-nav">
      <button type="button" id="date-prev" aria-label="Previous">‹</button>
      <input type="date" id="f-date">
      <button type="button" id="date-next" aria-label="Next">›</button>
    </div>
    <span class="date-label" id="date-label"></span>
    <div class="spacer"></div>
    <span class="feed-pill" id="feed-pill"></span>
  </div>

  <div id="slate-error" class="diverge-note"></div>

  <div class="section-title live">
    <span>Live now</span><span class="rule"></span><span class="meta" id="live-meta"></span>
  </div>
  <div id="live-section"></div>

  <div class="section-title">
    <span>Final</span><span class="rule"></span>
    <button type="button" id="completed-group-toggle" class="mini-toggle">Group by day</button>
  </div>
  <div id="completed-section"></div>

  <div class="section-title">
    <span id="upcoming-title">Upcoming</span><span class="rule"></span><span class="meta">NOT SCORED</span>
  </div>
  <div id="upcoming-section"></div>

  <div class="slate-footer">
    <span>// slate</span>
  </div>
</main>
</div>

<script src="/app.js"></script>
<script src="/charts.js"></script>
<script>
let SLATE_REGISTRY = { so_far: [], from_here: [] };
let LIVE_LABELS = {};
let CURRENT_SLATE = null;
let CURRENT_SCOPE = "week";
const EXPANDED = new Set();
const PREV_LIVE_SCORES = {};
let IN_FLIGHT = false;
let POLL_TIMER = null;

const POLL_MS = 30000; // half the live writer's ~60s cadence

// Proposed friendly wording for the retrospective (completed-game) metric
// registry (src/scoring.py's METRICS), matching the casual tone of
// LIVE_LABELS below -- unlike that one, this has no backend home yet
// (no shared friendly-label registry exists for retrospective metrics),
// so it's kept local to this page pending sign-off rather than added as
// new API surface.
const RETRO_METRIC_LABELS = {
  wp_volatility: "back-and-forth action",
  lead_changes: "frequent lead changes",
  time_spent_close: "time spent close",
  team_profile: "a ranked matchup",
  upset_risk: "upset risk",
  late_volatility: "late-game swings",
  clutch_finish: "a clutch finish",
  comeback_erosion: "comeback erosion",
};

function currentFilters() {
  return {
    scope: CURRENT_SCOPE,
    date: document.getElementById("f-date").value,
  };
}

function applyFiltersToForm(params) {
  setScope(params.scope || "week", { silent: true });
  // Leave blank if the URL didn't pin a date -- the request then omits
  // `date` and the server picks the nearest day with something still to
  // watch (see api_slate's default), rather than always landing on today.
  document.getElementById("f-date").value = params.date || "";
}

function setScope(scope, { silent = false } = {}) {
  CURRENT_SCOPE = scope;
  document.querySelectorAll("#scope-toggle button").forEach((b) => {
    b.classList.toggle("active", b.dataset.scope === scope);
  });
  if (!silent) {
    EXPANDED.clear();
    loadSlate({ push: true });
  }
}

// ---- filter-row meta (feed pill + date label) --------------------------------

function renderFeedPill(data) {
  const pill = document.getElementById("feed-pill");
  const s = data.live_feed.staleness_seconds;
  pill.innerHTML = "";
  pill.appendChild(el("span", { class: "dot" }));
  if (!data.live_feed.tracked_games) {
    pill.className = "feed-pill";
    pill.appendChild(el("span", { text: "No live games tracked right now" }));
    return;
  }
  const stale = s === null || s > 150;
  pill.className = "feed-pill" + (stale ? " stale" : " tracked");
  pill.appendChild(el("span", { text: s === null ? "feed not running" : `updated ${Math.round(s)}s ago` }));
}

const CFP_ROUND_NAMES = {
  first_round: "First Round",
  quarterfinal: "Quarterfinal",
  semifinal: "Semifinal",
  championship: "National Championship",
};

function postseasonLabel(p) {
  const rounds = (p.cfp_rounds || []).map((r) => CFP_ROUND_NAMES[r] || r);
  if (rounds.length && p.has_bowls) return `Bowl season · CFP ${rounds.join("/")} · ${p.season_year} postseason`;
  if (rounds.length) return `CFP ${rounds.join("/")} · ${p.season_year} postseason`;
  return `Bowl season · ${p.season_year} postseason`;
}

function renderDateLabel(data) {
  const label = document.getElementById("date-label");
  const anySpoilerHidden = ["live", "completed", "upcoming"].some((k) => data.sections[k].some((g) => g.spoiler_hidden));
  const tz = Intl.DateTimeFormat(undefined, { timeZoneName: "short" }).formatToParts(new Date())
    .find((p) => p.type === "timeZoneName").value;
  if (data.scope === "week") {
    const w = (data.weeks || [])[0];
    let text;
    if (w) text = `Week ${w.week} · ${w.season_year} regular season`;
    else if (data.postseason) text = postseasonLabel(data.postseason);
    else text = `Week of ${data.date}`;
    label.textContent = `${text} · ${tz}`;
  } else {
    const weekday = new Date(`${data.date}T00:00:00`).toLocaleDateString(undefined, { weekday: "short" }).toUpperCase();
    label.textContent = `${weekday} · ${tz}` + (anySpoilerHidden ? " · spoiler shield on" : "");
  }
}

// ---- shared: metric breakdown rows (no value text -- bar length is the signal) --

function metricBarRow(labelText, pct, dramaTone) {
  return el("div", { class: "metric-bar-row" }, [
    el("span", { class: "m-label", text: labelText }),
    el("span", { class: "m-track" }, el("i", { class: dramaTone ? "drama" : "", style: `width:${pct}%` })),
  ]);
}

function liveMetricGroup(container, labelText, metricsObj, spaced) {
  const applicable = Object.entries(metricsObj || {}).filter(([, v]) => v.applicable);
  if (!applicable.length) return;
  container.appendChild(el("div", { class: "metric-group-label" + (spaced ? " spaced" : ""), text: labelText }));
  applicable
    .sort((a, b) => b[1].normalized - a[1].normalized)
    .forEach(([name, v]) => {
      container.appendChild(metricBarRow(LIVE_LABELS[name] || name, Math.round(v.normalized * 100), labelText === "Drama from here"));
    });
}

function renderLiveExpand(container, g) {
  liveMetricGroup(container, "Quality so far", g.live.so_far.metrics, false);
  liveMetricGroup(container, "Drama from here", g.live.from_here.metrics, true);
}

function renderRetroExpand(container, g) {
  const applicable = Object.entries(g.metrics || {}).filter(([, v]) => v.applicable);
  container.appendChild(el("div", { class: "metric-group-label", text: "Score breakdown" }));
  applicable
    .sort((a, b) => b[1].norm - a[1].norm)
    .forEach(([name, v]) => {
      container.appendChild(metricBarRow(RETRO_METRIC_LABELS[name] || name, Math.round(v.norm * 100), false));
    });
}

// ---- live section -------------------------------------------------------------

function halvesBars(quality, drama) {
  const wrap = el("div", { class: "halves-grid" });
  [["Quality so far", quality, ""], ["Drama from here", drama, "drama"]].forEach(([label, value, cls]) => {
    wrap.appendChild(el("div", { class: "halves-row" }, [
      el("div", { class: "half-label" }, [label, el("span", { class: "tabular-nums", text: fmtScore(value) })]),
      el("div", { class: `half-meter ${cls}` }, el("i", { style: `width:${value === null || value === undefined ? 0 : Math.min(100, value * 100)}%` })),
    ]));
  });
  return wrap;
}

function divergeNote(live) {
  if (live.quality_so_far === null || live.quality_so_far === undefined) return null;
  if (Math.abs(live.quality_so_far - live.drama_from_here) <= 0.3) return null;
  return live.quality_so_far > live.drama_from_here
    ? "Was better earlier than it looks right now"
    : "Quiet so far, but heating up";
}

function renderLiveSection(games) {
  const wrap = document.getElementById("live-section");
  wrap.innerHTML = "";
  if (!games.length) {
    wrap.appendChild(el("div", { class: "empty-state", text: "No games in progress right now." }));
    return;
  }

  const [top, ...rest] = games;
  const hero = el("div", { class: "card hero-card" });
  hero.appendChild(el("div", { class: "hero-toprow" }, [
    el("div", {}, [
      el("h2", {}, [fmtMatchup(top) + " ", ...renderChips(top)]),
      el("div", { class: "live-progress", text: liveProgressLabel(top) }),
      el("div", { class: "sub", text: top.live.status.detail || (top.spoiler_hidden ? "In progress" : "") }),
    ]),
    // Keyed off live_score's own nullness, not spoiler_hidden -- a
    // LEVEL_SCORE game (spoiler_hidden: true) DOES reveal live_score (see
    // the two-tier-spoiler plan's decision 3), so gating this on
    // spoiler_hidden the way the tag below still correctly does would wrongly
    // hide the one thing that tier exists to show.
    top.live.live_score === null
      ? el("div", { class: "spoiler-hidden-tag", text: "SPOILER HIDDEN" })
      : el("div", { class: "hero-score-block" }, [
          el("div", { class: "hero-score tabular-nums", text: fmtScore(top.live.live_score) }),
          el("div", { class: "hero-score-label", text: "LIVE SCORE" }),
        ]),
  ]));
  if (!top.spoiler_hidden) {
    hero.appendChild(el("div", { class: "hero-context hero-headline", text: top.live.headline }));
    hero.appendChild(halvesBars(top.live.quality_so_far, top.live.drama_from_here));
    const note = divergeNote(top.live);
    if (note) hero.appendChild(el("div", { class: "diverge-note", text: note }));
  }
  hero.addEventListener("click", () => (location.href = `/game.html?id=${top.game_id}`));
  wrap.appendChild(hero);
  PREV_LIVE_SCORES[top.game_id] = top.live.live_score;

  if (!rest.length) return;

  const list = el("div", { class: "slate-list" });
  rest.forEach((g) => {
    // Keyed off live_score's own nullness, same as the hero block above --
    // a LEVEL_SCORE game's live_score is real and can legitimately flash on
    // change, not just a LEVEL_FULL game's.
    const flash = g.live.live_score !== null && PREV_LIVE_SCORES[g.game_id] !== undefined
      && Math.abs(PREV_LIVE_SCORES[g.game_id] - g.live.live_score) > 0.05;
    PREV_LIVE_SCORES[g.game_id] = g.live.live_score;

    const expanded = EXPANDED.has(g.game_id);
    const chevron = el("div", { class: "chevron" + (expanded ? " open" : ""), text: expanded ? "︿" : "⌄" });
    if (g.spoiler_hidden) chevron.style.visibility = "hidden";
    const whyText = g.spoiler_hidden
      ? (g.live.status.detail || "In progress")
      : `${g.live.status.detail || ""}${g.live.headline ? " · " + g.live.headline : ""}`;
    const row = el("div", { class: "slate-row row-live" + (flash ? " updated-flash" : "") }, [
      el("div", { class: "score-big", text: g.live.live_score === null ? "—" : fmtScore(g.live.live_score) }),
      el("div", { class: "row-info" }, [
        el("div", { class: "matchup-line" }, [el("span", { class: "name", text: fmtMatchup(g) }), ...renderChips(g)]),
        el("div", { class: "live-progress", text: liveProgressLabel(g) }),
        el("div", { class: "row-sub", text: whyText }),
      ]),
      chevron,
    ]);

    const expandWrap = el("div", { class: "expand-panel", style: expanded ? "" : "display:none" });
    if (!g.spoiler_hidden) {
      chevron.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const showing = expandWrap.style.display !== "none";
        expandWrap.style.display = showing ? "none" : "block";
        chevron.classList.toggle("open", !showing);
        chevron.textContent = showing ? "⌄" : "︿";
        if (showing) { EXPANDED.delete(g.game_id); return; }
        EXPANDED.add(g.game_id);
        if (expandWrap.children.length === 0) renderLiveExpand(expandWrap, g);
      });
      if (expanded) renderLiveExpand(expandWrap, g);
    }
    row.addEventListener("click", (ev) => {
      if (chevron.contains(ev.target)) return;
      location.href = `/game.html?id=${g.game_id}`;
    });

    list.appendChild(el("div", {}, [row, expandWrap]));
  });
  wrap.appendChild(list);
}

// ---- completed section --------------------------------------------------------

// Whether the Final section is one flat watchability-ranked list across the
// whole scope window, or split into one ranked sub-list per calendar day --
// a display preference, not shareable filter state like scope/date, so it
// lives in localStorage rather than the URL.
const GROUP_COMPLETED_KEY = "slate.completedGroupByDay";
let GROUP_COMPLETED_BY_DAY = localStorage.getItem(GROUP_COMPLETED_KEY) === "1";

// Calendar day in the viewer's own local timezone -- same basis fmtKickoff
// already displays kickoff times in, so a game grouped under "Thursday"
// here is the same Thursday its kickoff time reads as elsewhere on the row.
function localDayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayHeaderLabel(iso) {
  return new Date(iso).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }).toUpperCase();
}

function setGroupCompletedByDay(on) {
  GROUP_COMPLETED_BY_DAY = on;
  localStorage.setItem(GROUP_COMPLETED_KEY, on ? "1" : "0");
  document.getElementById("completed-group-toggle").classList.toggle("active", on);
  if (CURRENT_SLATE) renderCompletedSection(CURRENT_SLATE.sections.completed);
}

// 1-based "#rank of n" among just the scored games in `games`, keyed by
// game_id -- the within-day equivalent of the server's all-time g.rank, so
// a grouped day's badge reads e.g. "#2 of 6" for the games actually being
// compared instead of an all-time number that says nothing about how that
// day's slate stacked up against itself. `games` is expected pre-sorted by
// watchability_score desc (true of everything renderCompletedSection is
// ever called with), so array position alone gives the rank.
function localRanks(games) {
  const scored = games.filter((g) => g.watchability_score !== null);
  const map = new Map();
  scored.forEach((g, i) => map.set(g.game_id, `#${i + 1} of ${scored.length}`));
  return map;
}

// One completed-game row -- shared by the flat and grouped-by-day layouts,
// which differ only in how `rankText` was computed (global all-time rank
// vs. rank within one day's finished games).
function completedRow(g, rankText) {
  const expanded = EXPANDED.has("c" + g.game_id);
  const hasMetrics = Object.values(g.metrics || {}).some((v) => v.applicable);
  const chevron = el("div", { class: "chevron" + (expanded ? " open" : ""), text: expanded ? "︿" : "⌄" });
  if (!hasMetrics) chevron.style.visibility = "hidden";
  const scoreCell = g.watchability_score === null
    ? el("div", { class: "score-big", text: "—" })
    : el("div", { class: "score-with-meter" }, [
        el("span", { class: "val", text: fmtScore(g.watchability_score) }),
        el("div", { class: "meter" }, el("i", { style: `width:${Math.min(100, (g.watchability_score / 0.70) * 100)}%` })),
        el("span", { class: "pctile", text: g.percentile !== null ? fmtPct(g.percentile) : "" }),
      ]);

  // A real, clickable "Hidden" button, LEVEL_HIDDEN games only -- one
  // click reveals the watchability score (a real, persistent
  // LEVEL_SCORE override through the same /api/spoilers/game route
  // Settings' game-override card and game.html's "Show watchability
  // score" button both use, so it's visible/undoable from Settings on
  // any device going forward, not a client-side-only bypass). Placed
  // before the name in the matchup line, replacing the plain static
  // HIDDEN chip renderChips() would otherwise also render there.
  // Gated on g.is_scored too -- an unscored game can still fall in a
  // LEVEL_HIDDEN week (the spoiler policy is time-based, not "has this
  // actually been scored"), and there's nothing to reveal in that case;
  // gameChips() already renders "NOT SCORED" for it instead of "HIDDEN".
  let hiddenBtn = null;
  if (g.spoiler_level === 0 && g.is_scored) {
    hiddenBtn = el("button", { class: "chip chip-btn", type: "button", text: "Hidden", title: "Reveal the watchability score" });
    hiddenBtn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      hiddenBtn.disabled = true;
      hiddenBtn.textContent = "Loading…";
      try {
        await apiPost("/spoilers/game", { game_id: g.game_id, level: 1 });
        await loadSlate();
      } catch (e) {
        hiddenBtn.disabled = false;
        hiddenBtn.textContent = `Failed: ${e.message}`;
      }
    });
  }
  const chips = renderChips(g).filter((c) => !(hiddenBtn && c.textContent === "HIDDEN"));

  const row = el("div", { class: "slate-row row-completed" }, [
    scoreCell,
    el("div", { class: "row-info" }, [
      el("div", { class: "matchup-line" }, [hiddenBtn, el("span", { class: "name", text: fmtMatchup(g) }), ...chips]),
      el("div", { class: "row-sub" }, [
        el("span", { class: "kickoff-time", text: fmtKickoff(g.game_date) }),
        rankText ? ` · ${rankText}` : null,
      ]),
    ]),
    chevron,
  ]);

  const expandWrap = el("div", { class: "expand-panel", style: expanded ? "" : "display:none" });
  if (hasMetrics) {
    chevron.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const showing = expandWrap.style.display !== "none";
      expandWrap.style.display = showing ? "none" : "block";
      chevron.classList.toggle("open", !showing);
      chevron.textContent = showing ? "⌄" : "︿";
      if (showing) { EXPANDED.delete("c" + g.game_id); return; }
      EXPANDED.add("c" + g.game_id);
      if (expandWrap.children.length === 0) renderRetroExpand(expandWrap, g);
    });
    if (expanded) renderRetroExpand(expandWrap, g);
  }
  row.addEventListener("click", (ev) => {
    if (chevron.contains(ev.target)) return;
    location.href = `/game.html?id=${g.game_id}`;
  });

  return el("div", {}, [row, expandWrap]);
}

function renderCompletedSection(games) {
  const wrap = document.getElementById("completed-section");
  wrap.innerHTML = "";
  if (!games.length) {
    wrap.appendChild(el("div", { class: "empty-state", text: "No games finished in this window yet." }));
    return;
  }
  if (games.some((g) => g.spoiler_hidden)) {
    wrap.appendChild(el("div", {
      class: "slate-note",
      text: "Ranked by watchability",
    }));
  }

  if (!GROUP_COMPLETED_BY_DAY) {
    // g.rank is already null below LEVEL_SCORE (see redact_game_full) --
    // no separate spoiler_hidden gate needed here, and none should be
    // added: a LEVEL_SCORE game's rank is exactly what that tier reveals
    // (see the two-tier-spoiler plan's decision 1), so gating this on
    // spoiler_hidden the way it used to would wrongly withhold it.
    const list = el("div", { class: "slate-list" });
    games.forEach((g) => list.appendChild(completedRow(g, g.rank ? `#${g.rank} overall` : null)));
    wrap.appendChild(list);
    return;
  }

  const groups = new Map();
  games.forEach((g) => {
    const key = localDayKey(g.game_date);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(g);
  });
  // Most recent day first -- the day someone's checking the Final section
  // for is the one that just finished, not the start of the window.
  Array.from(groups.keys()).sort().reverse().forEach((key) => {
    const dayGames = groups.get(key);
    const ranks = localRanks(dayGames);
    wrap.appendChild(el("div", { class: "day-group-title", text: dayHeaderLabel(dayGames[0].game_date) }));
    const list = el("div", { class: "slate-list" });
    dayGames.forEach((g) => list.appendChild(completedRow(g, ranks.get(g.game_id) || null)));
    wrap.appendChild(list);
  });
}

// ---- upcoming section ----------------------------------------------------------

// Section title reads "Kickoff soon" only once the nearest game in this
// list is actually imminent (within an hour) -- otherwise "Upcoming" is
// the more honest label for a list that might span a whole week's Thursday
// games sitting hours or days out.
const KICKOFF_SOON_MS = 60 * 60 * 1000;

function renderUpcomingSection(unsortedGames) {
  const wrap = document.getElementById("upcoming-section");
  wrap.innerHTML = "";
  const title = document.getElementById("upcoming-title");
  // Kickoff time ascending, then (for same-time slots) the better-ranked
  // team in the game first -- the lower of home/away rank, unranked teams
  // (null) sorting last.
  const games = unsortedGames.slice().sort((a, b) => {
    const dateDiff = new Date(a.game_date) - new Date(b.game_date);
    if (dateDiff !== 0) return dateDiff;
    const bestRank = (g) => Math.min(g.home.rank ?? Infinity, g.away.rank ?? Infinity);
    return bestRank(a) - bestRank(b);
  });
  const soon = games.some((g) => {
    const msUntil = new Date(g.game_date).getTime() - Date.now();
    return msUntil >= 0 && msUntil <= KICKOFF_SOON_MS;
  });
  title.textContent = soon ? "Kickoff soon" : "Upcoming";
  if (!games.length) {
    wrap.appendChild(el("div", { class: "empty-state", text: "Nothing left to kick off in this window." }));
    return;
  }
  const list = el("div", { class: "slate-list" });
  games.forEach((g) => {
    const row = el("div", { class: "slate-row row-upcoming" }, [
      el("span", { class: "kickoff-time", text: fmtKickoff(g.game_date) }),
      el("div", { class: "matchup-line" }, [
        el("span", { class: "name", text: fmtMatchup(g) }),
        // Pre-kickoff games never have a score to spoil yet, so the HIDDEN/
        // SCORE ONLY chips (meaningful once something's actually being
        // withheld or revealed) are suppressed here even though
        // spoiler_level may already be < LEVEL_FULL.
        ...renderChips(g).filter((c) => !c.textContent.includes("HIDDEN") && c.textContent !== "SCORE ONLY"),
      ]),
    ]);
    row.addEventListener("click", () => (location.href = `/game.html?id=${g.game_id}`));
    list.appendChild(row);
  });
  wrap.appendChild(list);
}

// ---- load / poll ----------------------------------------------------------------

async function loadSlate({ push = false } = {}) {
  if (IN_FLIGHT) return;
  IN_FLIGHT = true;
  const errBox = document.getElementById("slate-error");
  try {
    const f = currentFilters();
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    setParams(f, { push });
    const data = await api("/slate", { ...f, tz });
    CURRENT_SLATE = data;
    errBox.textContent = "";
    // The date field starts blank so the server can pick its own default;
    // backfill it from what actually got resolved (but never clobber a
    // date the user picked -- that always arrives non-empty already).
    const dateInput = document.getElementById("f-date");
    if (!dateInput.value) dateInput.value = data.date;
    renderFeedPill(data);
    renderDateLabel(data);
    document.getElementById("live-meta").textContent = `${data.live_feed.tracked_games} TRACKED`;
    renderLiveSection(data.sections.live);
    renderCompletedSection(data.sections.completed);
    renderUpcomingSection(data.sections.upcoming);
  } catch (e) {
    errBox.textContent = `Could not load slate: ${e.message}`;
  } finally {
    IN_FLIGHT = false;
  }
}

function schedulePoll() {
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(() => {
    if (document.visibilityState === "visible") loadSlate();
  }, POLL_MS);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") loadSlate();
});

function fmtDateInput(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// Steps by the resolved window's own span (1 day, or the 7-day Tuesday-
// anchored window every "week" scope resolves to -- see serve.py's
// _tuesday_window/_postseason_week_window), but asks the server to resolve
// the actual target date rather than just adding days locally -- stepping
// past the CFP championship (or back past the season opener) needs to jump
// clear across the offseason to the adjacent season's boundary instead of
// landing in months of dead air. See /api/slate/adjacent.
async function stepSlate(dir) {
  const dateInput = document.getElementById("f-date");
  const anchor = dateInput.value || (CURRENT_SLATE && CURRENT_SLATE.date);
  if (!anchor) return;
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const { date } = await api("/slate/adjacent", { date: anchor, scope: CURRENT_SCOPE, dir: dir > 0 ? "next" : "prev", tz });
    dateInput.value = date;
  } catch (e) {
    const d = new Date(`${anchor}T00:00:00`);
    d.setDate(d.getDate() + (CURRENT_SCOPE === "week" ? 7 : 1) * dir);
    dateInput.value = fmtDateInput(d);
  }
  loadSlate({ push: true });
}

function wireFilters() {
  document.querySelectorAll("#scope-toggle button").forEach((b) => {
    b.addEventListener("click", () => setScope(b.dataset.scope));
  });
  document.getElementById("f-date").addEventListener("change", () => loadSlate({ push: true }));
  document.getElementById("date-prev").addEventListener("click", () => stepSlate(-1));
  document.getElementById("date-next").addEventListener("click", () => stepSlate(1));
  const groupToggle = document.getElementById("completed-group-toggle");
  groupToggle.classList.toggle("active", GROUP_COMPLETED_BY_DAY);
  groupToggle.addEventListener("click", () => setGroupCompletedByDay(!GROUP_COMPLETED_BY_DAY));
}

(async function init() {
  const registry = await api("/slate/registry");
  SLATE_REGISTRY = registry;
  LIVE_LABELS = {};
  [...registry.so_far, ...registry.from_here].forEach((m) => { LIVE_LABELS[m.name] = m.short_label || m.label; });
  const params = getParams();
  applyFiltersToForm(params);
  wireFilters();
  await loadSlate();
  schedulePoll();
})();
</script>
</body>
</html>
