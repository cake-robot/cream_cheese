<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — Watchability</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="game">

<div class="game-frame">
<header class="chrome">
  <nav>
    <a href="/slate.html">Slate</a>
    <a href="/top.html">Top games</a>
    <a href="/index.html" aria-current="page">Games</a>
    <a href="/settings.html">Spoilers</a>
    <a href="/analytics.html">Analytics</a>
    <a href="/feed.html" data-admin-only>Feed</a>
  </nav>
</header>
<div class="mnav-bar" id="mnav-bar">
  <button type="button" class="mnav-trig" id="mnav-trig" aria-expanded="false" aria-controls="mnav-drawer">
    <span class="mnav-page-title">Game</span><span class="c" id="mnav-chev">⌄</span>
  </button>
  <div class="mnav-drawer" id="mnav-drawer" hidden></div>
</div>

<main id="content">
  <div class="g-utility-row">
    <a class="back-link" id="back-link" href="/index.html">← BACK TO GAMES</a>
    <div class="g-neighbor-nav" id="neighbor-nav"></div>
  </div>
  <div id="body-mount">Loading…</div>
  <div class="g-footer">
    <span id="footer-id"></span>
  </div>
</main>
</div>

<script src="/app.js"></script>
<script src="/charts.js"></script>
<script>
function gameId() {
  return new URLSearchParams(location.search).get("id");
}

// Mirrors src/spoilers.py's LEVEL_* constants -- see the two-tier-spoiler
// plan. LEVEL_HIDDEN: nothing revealed. LEVEL_SCORE: the watchability
// composite (score/rank/percentile) is revealed, everything else stays
// hidden. LEVEL_FULL: everything revealed (today's ordinary game page).
const LEVEL_HIDDEN = 0;
const LEVEL_SCORE = 1;
const LEVEL_FULL = 2;

// Checked before the scored/live/not-scored branches in loadAndRenderGame()
// below, regardless of the game's actual status_state -- a spoiler-hidden
// game always renders this and nothing else, whether it's completed, live,
// or upcoming. (Routing on watchability_score/status_state instead would
// misfire here: a hidden but actually-scored-and-completed game comes back
// with watchability_score/live both null, which would otherwise fall
// through to renderNotScored()'s "This game has no win-probability data,
// so it has not been scored" -- true for an unscored game, false and
// misleading for one that's just hidden.)
function renderHidden(mount, detail) {
  const g = detail.game;
  mount.appendChild(el("div", { class: "matchup-header" }, [
    el("div", {}, [
      el("h1", {}, [fmtMatchup(g) + " ", ...renderChips(g)]),
      el("div", { class: "sub", text: `${fmtDate(g.game_date)}${venueLabel(g) ? " · " + venueLabel(g) : ""}${g.attendance ? " · " + g.attendance.toLocaleString() : ""} · ${seasonWeekLabel(g)}` }),
    ]),
  ]));
  const card = el("div", { class: "card" }, [
    el("h2", { text: "🙈 Watchability hidden" }),
    el("div", {
      class: "card-sub",
      text: "This game is spoiler-protected -- its score, charts, and what drove it are hidden. "
        + "Show just the watchability score (no final score or winner), or reveal everything "
        + "(adds a game override on the Settings page, undoable there) -- or change the setting "
        + "for its whole week from Settings.",
    }),
  ]);
  // Two-step progressive disclosure, both real persistent overrides through
  // the same /api/spoilers/game route Settings' own game-override card
  // uses -- not a client-side-only bypass, so either shows up in Settings'
  // "Active overrides" and is undoable there, on any device, going forward.
  const scoreBtn = el("button", { class: "reset", text: "Show watchability score" });
  const revealBtn = el("button", { class: "reset", text: "Reveal everything" });
  function wireRevealButton(btn, level) {
    btn.addEventListener("click", async () => {
      scoreBtn.disabled = true;
      revealBtn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "Loading…";
      try {
        await apiPost("/spoilers/game", { game_id: g.game_id, level });
        await loadAndRenderGame();
      } catch (e) {
        scoreBtn.disabled = false;
        revealBtn.disabled = false;
        btn.textContent = `${original} -- failed: ${e.message}, try again`;
      }
    });
  }
  wireRevealButton(scoreBtn, LEVEL_SCORE);
  wireRevealButton(revealBtn, LEVEL_FULL);
  card.appendChild(el("div", { style: "display:flex;gap:10px;margin-top:12px" }, [scoreBtn, revealBtn]));
  mount.appendChild(card);
}

function renderNotScored(mount, detail) {
  // Only reached for status_state 'pre' (unstarted, unscored by design) or
  // 'post' (completed but not yet fetched/scored) -- a live ('in') game is
  // routed to renderLive() instead, see init() below.
  const g = detail.game;
  mount.appendChild(el("div", { class: "matchup-header" }, [
    el("div", {}, [
      el("h1", {}, [fmtMatchup(g) + " ", ...renderChips(g)]),
      el("div", { class: "sub", text: `${fmtDate(g.game_date)}${venueLabel(g) ? " · " + venueLabel(g) : ""} · ${seasonWeekLabel(g)}` }),
    ]),
  ]));
  mount.appendChild(el("div", { class: "card" }, [
    el("h2", { text: g.status_state === "pre" ? "Scheduled" : "Not yet scored" }),
    el("div", { class: "card-sub", text: "This game has no win-probability data, so it has not been scored." }),
  ]));
  renderProvenance(mount, detail);
}

function renderProvenance(mount, detail) {
  const c = detail.corrections;
  if (!c || (!c.fox.length && !c.unusable && !c.manual.length)) return;
  const card = el("div", { class: "card" }, [
    el("h2", { text: "Data provenance" }),
    el("div", { class: "card-sub", text: c.fox_event_id ? `Fox event ${c.fox_event_id}` : "" }),
  ]);
  c.fox.forEach((r) => {
    card.appendChild(el("div", { class: "prov-row" }, [
      el("span", { text: "● " + (REGISTRY_LABEL[r.metric_name] || r.metric_name) }),
      el("span", { class: "arrow", text: `ESPN ${r.espn_value} →` }),
      el("span", { text: `Fox ${r.fox_value}` }),
    ]));
  });
  c.unusable_notes.forEach((r) => {
    card.appendChild(el("div", { class: "prov-row" }, `⚠ Fox reconciliation unusable for this game: ${r.notes || ""}`));
  });
  c.manual.forEach((m) => {
    const details = el("details", {}, [
      el("summary", { text: `Manual override: ${REGISTRY_LABEL[m.metric_name] || m.metric_name} → ${m.raw_value}` }),
      el("div", { style: "margin-top:6px;color:var(--ink-2);font-size:12.5px", text: m.reason }),
    ]);
    card.appendChild(details);
  });
  mount.appendChild(card);
}

let REGISTRY_LABEL = {};
let LIVE_REGISTRY = { so_far: [], from_here: [] };

// Shared by renderLive() and renderScored(): the WP chart card, plus (when
// detail.wp.has_coinflip -- a completed game with an archived game_raw_json,
// see serve.py's attach_coinflip_wp) an ESPN/Coin-flip toggle that swaps
// which WP series wpDualCard plots without touching anything else on the
// page. Toggle state persists across page loads via sessionStorage, same
// pattern as the drivers-view radial/bars toggle below.
function renderWpCard(g, wp, titleText, subtitleText) {
  const wpCard = el("div", { class: "g-card" });
  const headChildren = [
    el("div", {}, [
      el("div", { class: "g-card-title", text: titleText }),
      el("div", { class: "g-card-sub", text: subtitleText }),
    ]),
    el("div", { class: "g-wp-legend" }, [
      el("span", { class: "sw" }, [el("i", { style: "background:var(--g-ink-bright)" }), g.home.name.toUpperCase()]),
      el("span", { class: "sw" }, [el("i", { style: "background:var(--g-accent)" }), g.away.name.toUpperCase()]),
    ]),
  ];
  const wpBody = el("div", { class: "g-wp-body" });
  if (wp.has_coinflip) {
    let wpSeries = sessionStorage.getItem("wp-series") === "coinflip" ? "coinflip" : "espn";
    const wpToggle = el("div", { class: "g-view-toggle" }, [
      el("button", { type: "button", "data-series": "espn", text: "ESPN" }),
      el("button", { type: "button", "data-series": "coinflip", text: "Coin-flip" }),
    ]);
    function renderWpSeries() {
      wpToggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.series === wpSeries));
      wpBody.innerHTML = "";
      wpDualCard(wpBody, wp, g, wpSeries === "coinflip" ? "home_win_pct_coinflip" : "home_win_pct");
    }
    wpToggle.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", () => {
        if (wpSeries === b.dataset.series) return;
        wpSeries = b.dataset.series;
        sessionStorage.setItem("wp-series", wpSeries);
        renderWpSeries();
      });
    });
    headChildren.push(wpToggle);
    renderWpSeries();
  } else {
    wpDualCard(wpBody, wp, g);
  }
  wpCard.appendChild(el("div", { class: "g-card-head g-wp-head" }, headChildren));
  wpCard.appendChild(wpBody);
  return wpCard;
}

function renderLive(mount, detail) {
  const g = detail.game;
  const live = detail.live;
  const level = g.spoiler_level;

  mount.appendChild(el("div", { class: "matchup-header" }, [
    el("div", {}, [
      el("h1", {}, [fmtMatchup(g) + " ", ...renderChips(g)]),
      el("div", {
        class: "sub",
        text: `${live.status.detail || "In progress"} · ${fmtDate(g.game_date)}${venueLabel(g) ? " · " + venueLabel(g) : ""} · ${seasonWeekLabel(g)}`,
      }),
    ]),
  ]));

  // headline/quality_so_far/drama_from_here are all null below LEVEL_FULL
  // (see redact_live_score_only) -- live_score (the hero number itself)
  // survives at LEVEL_SCORE, so the hero block always renders, but the
  // headline line only when there's real text to show.
  const heroContext = [el("div", { text: `Updated ${Math.max(0, Math.round(live.stale_seconds))}s ago` })];
  if (live.headline) heroContext.unshift(el("div", { text: live.headline }));
  const hero = el("div", { class: "hero-row" }, [
    el("div", { class: "hero-score tabular-nums", text: fmtScore(live.live_score) }),
    el("div", { class: "hero-context" }, heroContext),
  ]);
  mount.appendChild(hero);

  if (level >= LEVEL_FULL) {
    const halvesCard = el("div", { class: "card" }, [
      el("h2", { text: "Quality so far vs. drama from here" }),
      el("div", {
        class: "card-sub",
        text: "The composite blends both (40% / 60%) so neither can silently cancel the other out.",
      }),
    ]);
    [
      ["Quality so far", live.quality_so_far],
      ["Drama from here", live.drama_from_here],
    ].forEach(([label, value]) => {
      halvesCard.appendChild(el("div", { class: "halves-row" }, [
        el("div", { class: "half-label" }, [label, " ", el("span", { class: "tabular-nums", text: fmtScore(value) })]),
        el("div", { class: "score-meter" }, el("i", { style: `width:${value === null ? 0 : Math.min(100, value * 100)}%` })),
      ]));
    });
    mount.appendChild(halvesCard);
  }

  if (detail.wp) {
    mount.appendChild(renderWpCard(g, detail.wp, "Win probability (live)",
      `${g.home.name} win probability and the score ladder so far, across ${detail.wp.n} plays.`));
  }

  // so_far/from_here metrics are {} below LEVEL_FULL (component detail),
  // so this card would otherwise render two empty "Quality so far"/"Drama
  // from here" sub-sections with nothing in them.
  if (level >= LEVEL_FULL) {
    const contribCard = el("div", { class: "card" }, [el("h2", { text: "What's driving this" })]);
    contribCard.appendChild(el("div", { class: "card-sub", text: "Quality so far" }));
    contributionBars(contribCard, adaptLiveMetrics(live.so_far.metrics), LIVE_REGISTRY.so_far, live.so_far.applicable_weight || 0.0001);
    contribCard.appendChild(el("div", { class: "card-sub", style: "margin-top:16px", text: "Drama from here" }));
    contributionBars(contribCard, adaptLiveMetrics(live.from_here.metrics), LIVE_REGISTRY.from_here, live.from_here.applicable_weight || 0.0001);
    mount.appendChild(contribCard);
  }

  // live_score/progress survive at LEVEL_SCORE (redact_live_history keeps
  // them, nulls quality_so_far/drama_from_here) and liveScoreChart() only
  // ever reads those two fields, so this chart is safe -- and worth
  // keeping -- at LEVEL_SCORE too.
  if (detail.live_history && detail.live_history.length > 1) {
    const histCard = el("div", { class: "card" }, [
      el("h2", { text: "Live score so far" }),
      el("div", { class: "card-sub", text: "How the recommendation has moved through the game." }),
    ]);
    liveScoreChart(histCard, detail.live_history);
    mount.appendChild(histCard);
  }

  // corrections are suppressed server-side below LEVEL_FULL (empty
  // manual/fox/unusable_notes), so renderProvenance()'s own early-return
  // guard already keeps this a no-op there -- no level check needed here.
  renderProvenance(mount, detail);
}

// Chips/status for the scored hero -- distinct from app.js's shared
// gameChips()/renderChips() (used by the games table, slate rows, etc.):
// this view gives the UW loss bonus its own oxblood grammar and drops the
// LIVE/HIDDEN/NOT-SCORED cases that can't apply once a game has a score.
function scoredHeroChips(g) {
  const chips = [];
  if (g.uw_loss_bonus) {
    chips.push(el("span", { class: "g-chip g-chip-uw", text: `UW LOSS +${g.uw_loss_bonus.toFixed(3)}` }));
  }
  [
    [g.conference_game, "CONF"],
    [g.neutral_site, "NEU"],
    [g.ot, "OT"],
    [g.has_fox_correction, "FOX"],
    [g.has_manual_correction, "MANUAL"],
  ].forEach(([on, label]) => { if (on) chips.push(el("span", { class: "g-chip", text: label })); });
  chips.push(el("span", { class: "g-status-word", text: "FINAL" }));
  return chips;
}

// Provenance card for the scored rail -- a dedicated renderer (not the
// shared renderProvenance() used by the hidden/not-scored branches) since
// this design's row shape (dot + ESPN-arrow-Fox) and footer line differ.
function renderProvenanceRail(mount, detail) {
  const c = detail.corrections, ot = detail.ot;
  const card = el("div", { class: "g-card g-card-pad-rail" });
  card.appendChild(el("div", { class: "g-card-title", text: "Provenance" }));
  if (c.fox_event_id) card.appendChild(el("div", { class: "g-card-sub", text: `Fox event ${c.fox_event_id}` }));

  const hasAny = c.fox.length || c.manual.length || c.unusable_notes.length;
  if (!hasAny) {
    card.appendChild(el("div", { class: "g-card-sub", style: "margin-top:16px", text: "No corrections on record for this game." }));
    mount.appendChild(card);
    return;
  }

  c.fox.forEach((r) => {
    card.appendChild(el("div", { class: "g-prov-row" }, [
      el("span", { class: "g-prov-dot" }),
      el("span", { class: "metric-label", text: REGISTRY_LABEL[r.metric_name] || r.metric_name }),
      el("span", { class: "arrow", text: `ESPN ${r.espn_value} →` }),
      el("span", { text: `Fox ${r.fox_value}` }),
    ]));
  });
  if (c.fox.length) {
    card.appendChild(el("div", { class: "g-prov-note", text: "Metric recomputed from Fox's independently collected play data." }));
  }
  c.unusable_notes.forEach((r) => {
    card.appendChild(el("div", { class: "g-prov-warn", text: `⚠ Fox reconciliation unusable for this game: ${r.notes || ""}` }));
  });
  c.manual.forEach((m) => {
    card.appendChild(el("details", { class: "g-prov-details" }, [
      el("summary", { text: `Manual override: ${REGISTRY_LABEL[m.metric_name] || m.metric_name} → ${m.raw_value}` }),
      el("div", { text: m.reason }),
    ]));
  });
  const footerParts = [c.manual.length ? `${c.manual.length} manual override${c.manual.length > 1 ? "s" : ""} on record.` : "No manual overrides on record."];
  if (ot && ot.is_ot && ot.note) footerParts.push(ot.note);
  card.appendChild(el("div", { class: "g-prov-footer", text: footerParts.join(" ") }));
  mount.appendChild(card);
}

// -- shared between renderScored() and renderScoreOnly(): the neighbor-by-
// rank nav, the watchability composite, and the three rank rails. A
// LEVEL_SCORE game's rank_context/neighbors ARE populated (see the
// two-tier-spoiler plan's decision 1) -- these are exactly the pieces that
// tier reveals, so both render paths share one implementation rather than
// two copies that could drift.

function buildNeighborNav(detail) {
  const rc = detail.rank_context;
  const neighborNav = document.getElementById("neighbor-nav");
  neighborNav.appendChild(detail.neighbors.prev_by_rank
    ? el("a", { href: `/game.html?id=${detail.neighbors.prev_by_rank.game_id}`, text: `‹ #${detail.neighbors.prev_by_rank.rank}` })
    : el("span"));
  neighborNav.appendChild(el("span", { class: "rank-of", text: rc ? `RANK ${rc.global.rank} / ${rc.global.n.toLocaleString()}` : "" }));
  neighborNav.appendChild(detail.neighbors.next_by_rank
    ? el("a", { href: `/game.html?id=${detail.neighbors.next_by_rank.game_id}`, text: `#${detail.neighbors.next_by_rank.rank} ›` })
    : el("span"));
}

function buildComposite(g) {
  const bonus = g.uw_loss_bonus || 0;
  const base = g.watchability_score - bonus;
  const composite = el("div", { class: "g-composite-wrap" }, [
    el("div", { class: "g-composite", text: fmtScore(g.watchability_score) }),
    el("div", { class: "g-composite-caption", text: "WATCHABILITY" }),
  ]);
  if (bonus) {
    composite.appendChild(el("div", { class: "g-bonus-line" }, [
      el("span", { class: "base", text: fmtScore(base) }), " metrics ",
      el("span", { class: "bonus", text: `+${bonus.toFixed(3)}` }), " UW loss",
    ]));
  }
  return composite;
}

function buildRankRails(rc) {
  const rankRailDefs = rc ? [
    { label: "ALL SEASONS", rank: rc.global.rank, n: rc.global.n, pct: rc.global.percentile, suffix: " percentile", sub: "scored" },
    { label: `${rc.season.label} SEASON`, rank: rc.season.rank, n: rc.season.n, pct: rc.season.percentile, suffix: "", sub: "" },
    { label: rc.week.label.toUpperCase(), rank: rc.week.rank, n: rc.week.n, pct: rc.week.percentile, suffix: "", sub: "" },
  ] : [];
  return el("div", { class: "g-rank-rails" }, rankRailDefs.map((r) => {
    const barPct = r.n ? Math.max(0, Math.min(100, (1 - r.rank / r.n) * 100)) : 0;
    return el("div", {}, [
      el("div", { class: "g-rank-rail-head" }, [el("span", { text: r.label }), el("span", { class: "rank-val", text: `#${r.rank}` })]),
      el("div", { class: "g-rank-track" }, [
        el("div", { class: "g-rank-fill", style: `width:${barPct}%` }),
        el("div", { class: "g-rank-marker", style: `left:${barPct}%` }),
      ]),
      el("div", { class: "g-rank-sub" }, [
        el("span", { class: "pctile", text: `${fmtPct(r.pct)}${r.suffix}` }),
        ` of ${r.n.toLocaleString()}${r.sub ? " " + r.sub : ""}`,
      ]),
    ]);
  }));
}

function renderScored(mount, detail) {
  const g = detail.game;
  const rc = detail.rank_context;
  const si = detail.score_integrity;

  buildNeighborNav(detail);

  // -- hero --
  const awayRank = g.away.rank ? `#${g.away.rank} ` : "";
  const homeRank = g.home.rank ? `#${g.home.rank} ` : "";
  const matchup = el("div", { class: "g-matchup" }, [
    awayRank, g.away.name, " ", el("span", { class: "score", text: String(g.away.score) }),
    el("br"),
    "at ", homeRank, g.home.name, " ", el("span", { class: "score", text: String(g.home.score) }),
  ]);
  const metaText = [fmtDate(g.game_date), venueLabel(g), g.attendance ? g.attendance.toLocaleString() : null, seasonWeekLabel(g)]
    .filter(Boolean).join(" · ");
  const heroLeft = el("div", {}, [
    el("div", { class: "g-chip-row" }, scoredHeroChips(g)),
    matchup,
    el("div", { class: "g-meta", text: metaText }),
  ]);

  mount.appendChild(el("div", { class: "g-hero" }, [
    heroLeft,
    el("div", { class: "g-hero-right" }, [buildComposite(g), el("div", { class: "g-hero-rule" }), buildRankRails(rc)]),
  ]));

  // -- body: rail layout --
  const mainCol = el("div", { class: "g-main-col" });
  const railCol = el("div", { class: "g-rail-col" });
  mount.appendChild(el("div", { class: "g-body" }, [mainCol, railCol]));

  if (detail.wp) {
    mainCol.appendChild(renderWpCard(g, detail.wp, "Win probability",
      `${g.home.name} win probability and the score ladder, given equal weight across ${detail.wp.n} plays.`));
  }

  const driversCard = el("div", { class: "g-card g-card-pad" });
  const driversBody = el("div");
  let driversView = sessionStorage.getItem("drivers-view") === "radial" ? "radial" : "bars";
  const viewToggle = el("div", { class: "g-view-toggle" }, [
    el("button", { type: "button", "data-view": "bars", text: "Bars" }),
    el("button", { type: "button", "data-view": "radial", text: "Radial" }),
  ]);
  function renderDriversView() {
    viewToggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.view === driversView));
    driversBody.innerHTML = "";
    if (driversView === "radial") radialScoreChart(driversBody, g.metrics, detail.registry);
    else driversWeighted(driversBody, g.metrics, detail.registry, si);
  }
  viewToggle.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      if (driversView === b.dataset.view) return;
      driversView = b.dataset.view;
      sessionStorage.setItem("drivers-view", driversView);
      renderDriversView();
    });
  });
  driversCard.appendChild(el("div", { class: "g-card-head" }, [
    el("div", {}, [
      el("div", { class: "g-card-title", text: "What drove this score" }),
      el("div", { class: "g-card-sub", text: `Points contributed to the ${fmtScore(g.watchability_score)} composite, against each metric's ceiling.` }),
    ]),
    viewToggle,
  ]));
  driversCard.appendChild(driversBody);
  renderDriversView();
  mainCol.appendChild(driversCard);

  const distCard = el("div", { class: "g-card g-card-pad-rail" });
  distCard.appendChild(el("div", { class: "g-card-title", text: "Where this sits" }));
  distCard.appendChild(el("div", { class: "g-card-sub", text: rc ? `${rc.global.n.toLocaleString()} scored games, all seasons.` : "" }));
  const distBody = el("div");
  distCard.appendChild(distBody);
  railCol.appendChild(distCard);
  api("/analytics").then((analytics) => {
    distributionRail(distBody, analytics.distribution.histogram, g.watchability_score);
  });

  renderProvenanceRail(railCol, detail);
}

// LEVEL_SCORE's own render path: the watchability composite, the three
// rank rails, and the neighbor-by-rank nav -- exactly what that tier
// reveals (see the two-tier-spoiler plan). No final score in the matchup
// line (g.away.score/g.home.score are null), no drivers card (g.metrics is
// {}), no WP chart (detail.wp is null), no provenance rail (corrections
// are suppressed below LEVEL_FULL). The distribution rail survives --
// "here's your score in context" is exactly the point of this tier.
function renderScoreOnly(mount, detail) {
  const g = detail.game;
  const rc = detail.rank_context;

  buildNeighborNav(detail);

  const awayRank = g.away.rank ? `#${g.away.rank} ` : "";
  const homeRank = g.home.rank ? `#${g.home.rank} ` : "";
  const matchup = el("div", { class: "g-matchup" }, [
    awayRank, g.away.name,
    el("br"),
    "at ", homeRank, g.home.name,
  ]);
  const metaText = [fmtDate(g.game_date), venueLabel(g), g.attendance ? g.attendance.toLocaleString() : null, seasonWeekLabel(g)]
    .filter(Boolean).join(" · ");
  const heroLeft = el("div", {}, [
    el("div", { class: "g-chip-row" }, scoredHeroChips(g)),
    matchup,
    el("div", { class: "g-meta", text: metaText }),
  ]);

  mount.appendChild(el("div", { class: "g-hero" }, [
    heroLeft,
    el("div", { class: "g-hero-right" }, [buildComposite(g), el("div", { class: "g-hero-rule" }), buildRankRails(rc)]),
  ]));

  const distCard = el("div", { class: "card" }, [
    el("h2", { text: "Where this sits" }),
    el("div", { class: "card-sub", text: rc ? `${rc.global.n.toLocaleString()} scored games, all seasons.` : "" }),
  ]);
  const distBody = el("div");
  distCard.appendChild(distBody);
  mount.appendChild(distCard);
  api("/analytics").then((analytics) => {
    distributionRail(distBody, analytics.distribution.histogram, g.watchability_score);
  });

  const revealCard = el("div", { class: "card" }, [
    el("h2", { text: "🙈 Score only" }),
    el("div", {
      class: "card-sub",
      text: "The final score, winner, and what drove this score are still hidden.",
    }),
  ]);
  const revealBtn = el("button", { class: "reset", text: "Show final score" });
  revealBtn.addEventListener("click", async () => {
    revealBtn.disabled = true;
    revealBtn.textContent = "Loading…";
    try {
      await apiPost("/spoilers/game", { game_id: g.game_id, level: LEVEL_FULL });
      await loadAndRenderGame();
    } catch (e) {
      revealBtn.disabled = false;
      revealBtn.textContent = `Failed: ${e.message} -- try again`;
    }
  });
  revealCard.appendChild(revealBtn);
  mount.appendChild(revealCard);
}

async function loadAndRenderGame() {
  const id = gameId();
  const mount = document.getElementById("body-mount");
  const neighborNav = document.getElementById("neighbor-nav");
  if (!id) { mount.textContent = "No game id provided."; return; }
  document.getElementById("footer-id").textContent = `// game ${id}`;

  let detail;
  try {
    detail = await api(`/games/${encodeURIComponent(id)}`);
  } catch (e) {
    mount.textContent = `Could not load game: ${e.message}`;
    return;
  }
  mount.innerHTML = "";
  neighborNav.innerHTML = "";
  // is_scored is checked first, before spoiler_level -- it's set
  // pre-redaction in shape_game() and reflects whether the pipeline has
  // actually computed a score, independent of the spoiler policy (which is
  // purely time-based). Without this, an unscored completed game that falls
  // in a LEVEL_HIDDEN week would hit the `level === LEVEL_HIDDEN` branch
  // below and render the "spoiler hidden, reveal it" UI for a score that
  // doesn't exist, instead of renderNotScored()'s "not yet scored" message.
  if (!detail.game.is_scored) {
    if (detail.game.status_state === "in" && detail.live) {
      const liveRegistry = await api("/slate/registry");
      LIVE_REGISTRY = liveRegistry;
      renderLive(mount, detail);
    } else {
      renderNotScored(mount, detail);
    }
    return;
  }
  // Routes on spoiler_level, not spoiler_hidden -- spoiler_hidden is true
  // for both LEVEL_HIDDEN and LEVEL_SCORE (see the two-tier-spoiler plan),
  // so routing on it alone would send a LEVEL_SCORE game into
  // renderHidden() and hide the composite/rank rails that tier exists to
  // show, or (if checked the other way) into renderScored() where it would
  // throw formatting a null g.away.score.
  const level = detail.game.spoiler_level;
  if (level === LEVEL_HIDDEN) {
    renderHidden(mount, detail);
  } else if (level === LEVEL_SCORE) {
    renderScoreOnly(mount, detail);
  } else {
    renderScored(mount, detail);
  }
}

(async function init() {
  const topSearch = sessionStorage.getItem("top-return-search");
  const gamesSearch = sessionStorage.getItem("games-return-search");
  const backLink = document.getElementById("back-link");
  if (topSearch) {
    backLink.href = "/top.html" + topSearch;
    backLink.textContent = "← BACK TO TOP GAMES";
  } else if (gamesSearch) {
    backLink.href = "/index.html" + gamesSearch;
  }

  const metricsResp = await api("/metrics");
  metricsResp.metrics.forEach((m) => (REGISTRY_LABEL[m.name] = m.label));

  await loadAndRenderGame();
})();
</script>
</body>
</html>
