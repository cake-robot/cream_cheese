<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — Watchability</title>
<link rel="stylesheet" href="/style.css">
<script>
(function () {
  var t = localStorage.getItem("theme");
  if (t && t !== "system") document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body data-page="game">

<header class="chrome">
  <span class="brand">🏈 Watchability</span>
  <nav>
    <a href="/index.html">Games</a>
    <a href="/top.html">Top games</a>
    <a href="/analytics.html">Analytics</a>
  </nav>
  <div class="theme-toggle" id="theme-toggle">
    <button data-mode="light" aria-pressed="false">Light</button>
    <button data-mode="dark" aria-pressed="false">Dark</button>
    <button data-mode="system" aria-pressed="true">System</button>
  </div>
</header>

<main id="content">
  <a class="back-link" id="back-link" href="/index.html">← Back to games</a>
  <div id="body-mount">Loading…</div>
</main>

<script src="/app.js"></script>
<script src="/charts.js"></script>
<script>
function gameId() {
  return new URLSearchParams(location.search).get("id");
}

function renderNotScored(mount, detail) {
  const g = detail.game;
  mount.appendChild(el("div", { class: "matchup-header" }, [
    el("div", {}, [
      el("h1", { text: fmtMatchup(g) }),
      el("div", { class: "sub", text: `${fmtDate(g.game_date)}${g.venue_name ? " · " + g.venue_name : ""} · ${g.season_year} week ${g.week ?? "—"}` }),
    ]),
  ]));
  mount.appendChild(el("div", { class: "card" }, [
    el("h2", { text: g.status_state === "pre" ? "Scheduled" : "Not yet scored" }),
    el("div", { class: "card-sub", text: "This game has no win-probability data, so it has not been scored." }),
  ]));
  renderProvenance(mount, detail);
}

function renderProvenance(mount, detail) {
  const c = detail.corrections;
  if (!c || (!c.fox.length && !c.unusable && !c.manual.length)) return;
  const card = el("div", { class: "card" }, [
    el("h2", { text: "Data provenance" }),
    el("div", { class: "card-sub", text: c.fox_event_id ? `Fox event ${c.fox_event_id}` : "" }),
  ]);
  c.fox.forEach((r) => {
    card.appendChild(el("div", { class: "prov-row" }, [
      el("span", { text: "● " + (REGISTRY_LABEL[r.metric_name] || r.metric_name) }),
      el("span", { class: "arrow", text: `ESPN ${r.espn_value} →` }),
      el("span", { text: `Fox ${r.fox_value}` }),
    ]));
  });
  c.unusable_notes.forEach((r) => {
    card.appendChild(el("div", { class: "prov-row" }, `⚠ Fox reconciliation unusable for this game: ${r.notes || ""}`));
  });
  c.manual.forEach((m) => {
    const details = el("details", {}, [
      el("summary", { text: `Manual override: ${REGISTRY_LABEL[m.metric_name] || m.metric_name} → ${m.raw_value}` }),
      el("div", { style: "margin-top:6px;color:var(--ink-2);font-size:12.5px", text: m.reason }),
    ]);
    card.appendChild(details);
  });
  mount.appendChild(card);
}

let REGISTRY_LABEL = {};

function renderScored(mount, detail) {
  const g = detail.game;
  const rc = detail.rank_context;
  const si = detail.score_integrity;

  const header = el("div", { class: "matchup-header" }, [
    el("div", {}, [
      el("h1", {}, [fmtMatchup(g) + " ", ...renderChips(g)]),
      el("div", { class: "sub", text: `${fmtDate(g.game_date)}${g.venue_name ? " · " + g.venue_name : ""}${g.attendance ? " · " + g.attendance.toLocaleString() : ""} · ${g.season_year} week ${g.week ?? "—"}` }),
    ]),
    el("div", { class: "neighbor-nav" }, [
      detail.neighbors.prev_by_rank
        ? el("a", { href: `/game.html?id=${detail.neighbors.prev_by_rank.game_id}`, text: `‹ #${detail.neighbors.prev_by_rank.rank}` })
        : el("span"),
      el("span", { text: rc ? `rank ${rc.global.rank} of ${rc.global.n}` : "" }),
      detail.neighbors.next_by_rank
        ? el("a", { href: `/game.html?id=${detail.neighbors.next_by_rank.game_id}`, text: `#${detail.neighbors.next_by_rank.rank} ›` })
        : el("span"),
    ]),
  ]);
  mount.appendChild(header);

  const hero = el("div", { class: "hero-row" }, [
    el("div", { class: "hero-score tabular-nums", text: fmtScore(g.watchability_score) }),
    el("div", { class: "hero-context" }, [
      el("div", { text: rc ? `${fmtPct(rc.global.percentile)} percentile · #${rc.global.rank} of ${rc.global.n} scored games` : "" }),
      el("div", { text: rc ? `#${rc.season.rank} of ${rc.season.n} in ${rc.season.label} · #${rc.week.rank} of ${rc.week.n} in ${rc.week.label}` : "" }),
    ]),
  ]);
  mount.appendChild(hero);

  const integrityChip = si.matches
    ? el("span", { class: "ok", text: "✓ matches stored score" })
    : el("span", { class: "bad", text: `⚠ differs from stored score by ${si.delta.toFixed(4)} — caps may have changed since this game was scored` });
  mount.appendChild(el("div", { class: "integrity-strip" }, [
    el("span", { text: `Σ contributions ${si.weighted_sum.toFixed(3)} ÷ applicable weight ${si.applicable_weight.toFixed(1)} = ${si.composite_recomputed.toFixed(4)}` }),
    integrityChip,
  ]));

  if (detail.wp) {
    const wpCard = el("div", { class: "card" }, [
      el("h2", { text: `Win probability — ${g.away.name} at ${g.home.name}` }),
      el("div", { class: "card-sub", text: `Home win probability across ${detail.wp.n} plays.` }),
    ]);
    wpChart(wpCard, detail.wp, g);
    mount.appendChild(wpCard);
  }

  const contribCard = el("div", { class: "card" }, [
    el("h2", { text: "What drove this score" }),
    el("div", { class: "card-sub", text: `Points contributed to the ${fmtScore(g.watchability_score)} composite.` }),
  ]);
  contributionBars(contribCard, g.metrics, detail.registry, si.applicable_weight);
  mount.appendChild(contribCard);

  const twoCol = el("div", { class: "two-col" });
  const histCard = el("div", { class: "card" }, [el("h2", { text: "Where this game sits" })]);
  const histMount = el("div");
  histCard.appendChild(histMount);
  twoCol.appendChild(histCard);
  const provMount = el("div");
  twoCol.appendChild(provMount);
  mount.appendChild(twoCol);
  renderProvenance(provMount, detail);
  if (provMount.children.length === 0) {
    provMount.appendChild(el("div", { class: "card" }, [el("h2", { text: "Data provenance" }), el("div", { class: "card-sub", text: "No corrections on record for this game." })]));
  }

  api("/analytics").then((analytics) => {
    histogram(histMount, analytics.distribution.histogram, {
      width: 320, height: 90,
      markers: [{ value: g.watchability_score, label: fmtScore(g.watchability_score) }],
    });
  });
}

(async function init() {
  const id = gameId();
  const mount = document.getElementById("body-mount");
  if (!id) { mount.textContent = "No game id provided."; return; }
  const savedSearch = sessionStorage.getItem("games-return-search");
  if (savedSearch) document.getElementById("back-link").href = "/index.html" + savedSearch;

  const metricsResp = await api("/metrics");
  metricsResp.metrics.forEach((m) => (REGISTRY_LABEL[m.name] = m.label));

  let detail;
  try {
    detail = await api(`/games/${encodeURIComponent(id)}`);
  } catch (e) {
    mount.textContent = `Could not load game: ${e.message}`;
    return;
  }
  mount.innerHTML = "";
  if (detail.game.watchability_score === null) {
    renderNotScored(mount, detail);
  } else {
    renderScored(mount, detail);
  }
})();
</script>
</body>
</html>
